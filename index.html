<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MojnBot</title>
  <meta name="description" content="MojnBot snakker kun sønderjysk. En chatbot fra Affenrå-egnen.">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:title" content="MojnBot – æ synnejysk chatbot">
  <meta property="og:description" content="Æ snakke kun synnejysk. Spøe mæ om byer, kaffe, ringrien, Æ Spritte elle naboerne.">
  <meta property="og:image" content="https://folmerfestersen.github.io/MojnBot/assets/logo-512.png">
  <link rel="stylesheet" href="css/stil.css?v=24">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <img src="assets/logo-512.png" alt="" width="34" height="34">
      <span>MojnBot</span>
    </a>
    <div class="top-hoejre">
      <button id="rydChat" class="ikon" title="Ny snak" aria-label="Ny snak">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
  </header>

  <main class="scroll" id="scroll">
    <section class="tom" id="tom">
      <img class="tom-logo" src="assets/logo-512.png" alt="MojnBot">
      <h1>Mojn!</h1>
      <p>Æ æ MojnBot. Æ snakke kun synnejysk, men do må skryw lich som do vil.</p>
      <button class="dagens-ord" id="dagensOrd" type="button" hidden></button>
      <div class="kort" id="forslag"></div>
    </section>
    <section class="chat" id="chat" aria-live="polite"></section>
  </main>

  <footer class="bund">
    <form class="skriv" id="form" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Skryw tæ MojnBot…" maxlength="1000" required></textarea>
      <button type="submit" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </form>
    <p class="lille">Bygget mæ snaps i æ kaffe · <a href="https://github.com/folmerfestersen/MojnBot" target="_blank" rel="noopener">GitHub</a> · <a href="docs/stilguide.md" target="_blank">Stilguide</a></p>
  </footer>

  <script src="data/viden.js?v=24"></script>
  <script src="js/oversaetter.js?v=24"></script>
  <script src="js/mojnbot.js?v=24"></script>
  <script src="data/prompt.js?v=24"></script>
  <script src="js/config.js?v=24"></script>
  <script src="js/app.js?v=24"></script>
</body>
</html>
