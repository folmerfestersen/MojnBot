<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MojnBot – æ synnejysk chatbot</title>
  <meta name="description" content="MojnBot snakker kun sønderjysk. En chatbot fra Affenrå-egnen.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="css/stil.css?v=3">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">☕</span>
      <div>
        <h1>MojnBot</h1>
        <p class="tagline">Æ snakke kun synnejysk. Do ka skryw, som do vil.</p>
      </div>
    </div>
    <div class="status">
      <button id="rydChat" class="ikon" title="Ryd samtale" aria-label="Ryd samtale">🧹</button>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <div class="forslag" id="forslag">
    <button data-t="Mojn! Hvem er du?">Hvem æ do?</button>
    <button data-t="Fortæl om Æ Spritte">Æ Spritte</button>
    <button data-t="Hvad sker der med Gunnar og Birgit fra nummer 16?">Nummer 16</button>
    <button data-t="Fortæl mig om det sønderjyske kaffebord">Æ kaffeboe</button>
    <button data-t="Oversæt: Jeg vil gerne have en kop kaffe og et stykke kage">Øwersæt nau</button>
    <button data-t="Hvad ved du om Rødekro?">Røekro</button>
  </div>

  <form class="skriv" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Skryw nau tæ MojnBot…" maxlength="1000" required>
    <button type="submit" id="send">Send</button>
  </form>


  <footer class="bund">
    <span>Bygget mæ snaps i æ kaffe · <a href="https://github.com/folmerfestersen/MojnBot" target="_blank" rel="noopener">GitHub</a> · <a href="docs/stilguide.md" target="_blank">Stilguide</a></span>
  </footer>

  <script src="data/viden.js?v=3"></script>
  <script src="js/oversaetter.js?v=3"></script>
  <script src="js/mojnbot.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
